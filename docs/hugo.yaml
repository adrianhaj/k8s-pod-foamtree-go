baseURL: https://adrianhaj.github.io/k8s-pod-foamtree-go/
title: k8sfoams
locale: en-us
module:
  proxy: https://proxy.golang.org,direct
  imports:
    - path: github.com/imfing/hextra
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: https://github.com/adrianhaj/k8s-pod-foamtree-go
      params:
        icon: github
params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: img/logo.png
      width: 24
      height: 24
  theme:
    default: system
    displayToggle: true
  page:
    width: normal
  footer:
    displayCopyright: false
    displayPoweredBy: false
  editURL:
    enable: true
    base: https://github.com/adrianhaj/k8s-pod-foamtree-go/edit/main/docs/content
