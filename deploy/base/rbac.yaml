apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8sfoams
---
# Read-only, and only what the dashboard shows. Pod specs can carry env values,
# so treat anyone who can exec into this pod as able to read them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8sfoams
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  # The Logs tab. Logs often carry secrets: every viewer allowed into the
  # dashboard can read every pod's logs through this account.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # The Usage color mode. Optional: without metrics-server the map just has no readings.
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8sfoams
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8sfoams
subjects:
  - kind: ServiceAccount
    name: k8sfoams
    namespace: k8sfoams
